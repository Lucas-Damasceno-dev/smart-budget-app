version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: financeflow-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-financeflow}
      POSTGRES_USER: ${DB_USERNAME:-financeflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-financeflow} -d ${DB_NAME:-financeflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeflow-network-prod
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: financeflow-redis-prod
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeflow-network-prod
    restart: unless-stopped

  api:
    image: financeflow/api:${VERSION:-latest}
    container_name: financeflow-api-prod
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-financeflow}
      - DB_USERNAME=${DB_USERNAME:-financeflow}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8080
      - CORS_ORIGINS=${CORS_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - financeflow-network-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  frontend:
    image: financeflow/frontend:${VERSION:-latest}
    container_name: financeflow-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - financeflow-network-prod
    restart: unless-stopped

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  financeflow-network-prod:
    driver: bridge

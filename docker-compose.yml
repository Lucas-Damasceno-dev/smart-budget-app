services:
  postgres:
    image: postgres:16-alpine
    container_name: financeflow-db
    environment:
      POSTGRES_DB: financeflow
      POSTGRES_USER: financeflow
      POSTGRES_PASSWORD: financeflow123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeflow -d financeflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeflow-network

  redis:
    image: redis:7-alpine
    container_name: financeflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financeflow-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeflow-api
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=financeflow
      - DB_USERNAME=financeflow
      - DB_PASSWORD=financeflow123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=ZmluYW5jZWZsb3ctc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmctZm9yLWhzMjU2
      - SERVER_PORT=8080
      - CORS_ORIGINS=http://localhost:4200,http://localhost:80,http://localhost
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - financeflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financeflow-frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - financeflow-network

volumes:
  postgres_data:
  redis_data:

networks:
  financeflow-network:
    driver: bridge

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>FinanceFlow - Gerenciamento Financeiro</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aplicação de gerenciamento de finanças pessoais">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="mat-typography">
  <app-root></app-root>
  <noscript>Por favor, habilite o JavaScript para usar esta aplicação.</noscript>
  <script>
    // Remove noscript fallback quickly when JS is enabled to avoid overlay flashes
    (function(){
      try {
        var ns = document.querySelector('noscript');
        if (ns) ns.remove();
        // ensure background not blocked
        document.body.style.backgroundColor = '';
      } catch(e) {
        // best-effort, ignore
      }
    })();
  </script>
</body>
</html>

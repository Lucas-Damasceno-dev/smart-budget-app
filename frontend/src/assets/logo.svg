<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="ff-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ff-accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="ff-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Background Rounded Container -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#ff-logo-grad)" />

  <!-- Dynamic Geometric Waves / Trend Line -->
  <path d="M30 75 L48 55 L64 65 L90 38" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="90" cy="38" r="6" fill="url(#ff-accent-grad)" filter="url(#ff-glow)" />

  <!-- Subtle Financial Arc -->
  <path d="M32 42 C 45 32, 75 32, 88 42" stroke="rgba(255, 255, 255, 0.35)" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4" />
</svg>
